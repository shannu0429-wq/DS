{% extends 'base.html' %}

{% block content %}
<div class="content-container">
    <div style="max-width: 900px; margin: 0 auto;">
        <div style="margin-bottom: 24px;">
            <a href="{{ url_for('manage_tutorials') }}" class="btn btn-outline btn-sm">&larr; Back to Tutorials List</a>
            <h1 style="font-size: 2rem; color: var(--primary-dark); margin-top: 10px;">Edit Tutorial #{{ tutorial.id }}</h1>
        </div>

        <div style="background: var(--bg-card); border: 2px solid var(--border-color); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-sm);">
            <form method="POST" action="{{ url_for('edit_tutorial', tutorial_id=tutorial.id) }}">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="category" class="form-label">Category *</label>
                        <select id="category" name="category" class="form-control" required>
                            <option value="smartphone_basics" {% if tutorial.category == 'smartphone_basics' %}selected{% endif %}>Smartphone Basics</option>
                            <option value="digital_payments" {% if tutorial.category == 'digital_payments' %}selected{% endif %}>Digital Payments</option>
                            <option value="scam_awareness" {% if tutorial.category == 'scam_awareness' %}selected{% endif %}>Scam Awareness</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="display_order" class="form-label">Display Order *</label>
                        <input type="number" id="display_order" name="display_order" class="form-control" value="{{ tutorial.display_order }}" required>
                    </div>
                </div>

                <div class="two-col-grid" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label for="title_en" class="form-label">Title (English) *</label>
                        <input type="text" id="title_en" name="title_en" class="form-control" value="{{ tutorial.title_en }}" required>
                    </div>
                    <div class="form-group">
                        <label for="title_te" class="form-label">Title (Telugu) *</label>
                        <input type="text" id="title_te" name="title_te" class="form-control" value="{{ tutorial.title_te }}" required>
                    </div>
                </div>

                <div class="two-col-grid" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label for="description_en" class="form-label">Short Summary (English) *</label>
                        <textarea id="description_en" name="description_en" class="form-control" style="min-height: 80px;" required>{{ tutorial.description_en }}</textarea>
                    </div>
                    <div class="form-group">
                        <label for="description_te" class="form-label">Short Summary (Telugu) *</label>
                        <textarea id="description_te" name="description_te" class="form-control" style="min-height: 80px;" required>{{ tutorial.description_te }}</textarea>
                    </div>
                </div>

                <div class="two-col-grid" style="margin-bottom: 24px;">
                    <div class="form-group">
                        <label for="content_en" class="form-label">Full Step-by-Step Instructions (English) *</label>
                        <textarea id="content_en" name="content_en" class="form-control" style="min-height: 140px;" required>{{ tutorial.content_en }}</textarea>
                    </div>
                    <div class="form-group">
                        <label for="content_te" class="form-label">Full Step-by-Step Instructions (Telugu) *</label>
                        <textarea id="content_te" name="content_te" class="form-control" style="min-height: 140px;" required>{{ tutorial.content_te }}</textarea>
                    </div>
                </div>

                <div style="display: flex; gap: 16px;">
                    <button type="submit" class="btn btn-primary btn-lg">Update Tutorial</button>
                    <a href="{{ url_for('manage_tutorials') }}" class="btn btn-outline btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
